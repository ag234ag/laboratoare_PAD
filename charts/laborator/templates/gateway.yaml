apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-nginx
  labels:
    {{- include "laborator.labels" . | nindent 4 }}
data:
  default.conf: |
    resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
    map $http_x_data_house $api_upstream {
      default "";
    {{- range .Values.dataHouses }}
      "{{ .id }}" "api-{{ .id }}.{{ $.Release.Namespace }}.svc.cluster.local:3000";
    {{- end }}
    }
    include /etc/nginx/credentials/api-key-map.conf;
    server {
      listen 8080;
      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }
      location / {
        if ($api_key_valid = 0) { return 401; }
        if ($api_upstream = "") { return 400; }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$api_upstream;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    {{- include "laborator.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: gateway
      annotations:
        checksum/api-key: {{ .Values.security.apiKey | sha256sum | quote }}
        checksum/data-houses: {{ include "laborator.houseIdsJson" . | sha256sum | quote }}
    spec:
      containers:
        - name: nginx
          image: {{ .Values.gateway.image | quote }}
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: credentials
              mountPath: /etc/nginx/credentials
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: nginx-config
          configMap:
            name: gateway-nginx
        - name: credentials
          secret:
            secretName: {{ include "laborator.name" . }}-credentials
            items:
              - key: api-key-map.conf
                path: api-key-map.conf
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    {{- include "laborator.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: {{ .Values.gateway.nodePort }}
