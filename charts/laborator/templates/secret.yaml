apiVersion: v1
kind: Secret
metadata:
  name: {{ include "laborator.name" . }}-credentials
  labels:
    {{- include "laborator.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ required "Set security.apiKey when installing the chart" .Values.security.apiKey | quote }}
  mongo-root-password: {{ .Values.security.mongoRootPassword | quote }}
  rabbit-user: {{ .Values.security.rabbitUser | quote }}
  rabbit-password: {{ .Values.security.rabbitPassword | quote }}
  api-key-map.conf: |
    map $http_x_api_key $api_key_valid {
      default 0;
      "{{ required "Set security.apiKey when installing the chart" .Values.security.apiKey }}" 1;
    }
